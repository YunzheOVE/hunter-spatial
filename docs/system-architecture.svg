<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">How Hunter Spatial works</title>
  <desc id="desc">A Python pipeline turns Hunter College's public floor plans into floor shapes and a network of walkable connections. The browser uses these files to display the 3D map and calculate indoor directions. A separate server reads SQLite records and stored image files to deliver approved 360-degree photos on request.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#786788" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family: 'Segoe UI', Arial, sans-serif; fill: #251937}
      .kicker {font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #63388a}
      .title {font-size: 35px; font-weight: 750; letter-spacing: -.7px}
      .label {font-size: 20px; font-weight: 700}
      .detail {font-size: 16px; fill: #554963}
      .browser-detail {font-size: 16px; fill: #ead9f8}
      .browser-label {font-size: 20px; font-weight: 650; fill: #fff}
      .outline {fill: #fff; stroke: #ddd0e8; stroke-width: 1.2}
      .icon {fill: none; stroke: #773ca1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round}
      .line {fill: none; stroke: #786788; stroke-width: 2; marker-end: url(#arrow)}
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="438" rx="23" fill="#faf7fd" stroke="#e0d4ea"/>
  <text x="34" y="38" class="kicker">HUNTER SPATIAL</text>
  <text x="33" y="78" class="title">How the campus map works</text>

  <text x="34" y="125" class="kicker">MAP DATA · PREPARED BEFORE USE</text>
  <text x="34" y="281" class="kicker">360° PHOTOS · LOADED ON REQUEST</text>

  <rect x="33" y="141" width="238" height="110" rx="14" class="outline"/>
  <rect x="309" y="141" width="270" height="110" rx="14" class="outline"/>
  <rect x="33" y="297" width="238" height="110" rx="14" class="outline"/>
  <rect x="309" y="297" width="270" height="110" rx="14" class="outline"/>

  <g class="icon" aria-hidden="true">
    <path d="m52 169 7-3 7 3 7-3v15l-7 3-7-3-7 3z M59 166v15m7-12v15"/>
    <path d="M329 166h12l5 5v14h-17z M341 166v5h5 M333 175h9m-9 5h9"/>
    <ellipse cx="62" cy="325" rx="10" ry="4"/>
    <path d="M52 325v12c0 2 4.5 4 10 4s10-2 10-4v-12m-20 6c0 2 4.5 4 10 4s10-2 10-4"/>
    <rect x="327" y="321" width="21" height="8" rx="2"/>
    <rect x="327" y="332" width="21" height="8" rx="2"/>
    <path d="M331 325h1m-1 11h1"/>
  </g>

  <text x="83" y="182" class="label">Hunter floor plans</text>
  <text x="52" y="217" class="detail">From the public campus map</text>

  <text x="357" y="182" class="label">Prepared map files</text>
  <text x="327" y="217" class="detail">Floor shapes and walkable paths</text>
  <text x="327" y="237" class="detail">exported by a Python pipeline</text>

  <text x="83" y="338" class="label">Panorama library</text>
  <text x="52" y="373" class="detail">SQLite and stored image files</text>

  <text x="357" y="338" class="label">Panorama service</text>
  <text x="327" y="373" class="detail">The server delivers photos</text>
  <text x="327" y="393" class="detail">approved for public viewing</text>

  <rect x="619" y="110" width="308" height="297" rx="17" fill="#351c4b"/>
  <text x="641" y="142" font-size="14" font-weight="700" letter-spacing="2" fill="#e3c6fa" style="fill:#e3c6fa">IN YOUR BROWSER</text>
  <rect x="635" y="158" width="276" height="67" rx="11" fill="#4b2c62"/>
  <rect x="635" y="235" width="276" height="67" rx="11" fill="#4b2c62"/>
  <rect x="635" y="312" width="276" height="78" rx="11" fill="#4b2c62"/>
  <text x="651" y="185" class="browser-label">Explore in 3D</text>
  <text x="651" y="208" class="browser-detail">Search rooms and switch floors</text>
  <text x="651" y="262" class="browser-label">Get indoor directions</text>
  <text x="651" y="285" class="browser-detail">Find a route through campus</text>
  <text x="651" y="344" class="browser-label">Look around in 360°</text>
  <text x="651" y="367" class="browser-detail">Open a photo where available</text>

